name: Install jj
description: >
  Install jj for the jj integration tests (git is preinstalled on runners).
  jj publishes no checksums or attestations, so pin the tarball's sha256 here
  for integrity — release assets are mutable.
runs:
  using: composite
  steps:
    - name: Install jj
      shell: bash
      run: |
        curl --silent --fail --location --output /tmp/jj.tar.gz \
          https://github.com/jj-vcs/jj/releases/download/v0.47.1/jj-v0.47.1-x86_64-unknown-linux-musl.tar.gz
        echo 'd4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7  /tmp/jj.tar.gz' | sha256sum --check
        mkdir --parents "$HOME/.local/bin"
        tar --extract --gzip --file /tmp/jj.tar.gz --directory "$HOME/.local/bin" ./jj
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/jj" --version
